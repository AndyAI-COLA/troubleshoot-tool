name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 2.1.0），留空则自动从 pyproject.toml 读取'
        required: false
        type: string
      publish_docker:
        description: '是否发布 Docker 镜像'
        required: false
        default: true
        type: boolean
      publish_pypi:
        description: '是否发布到 PyPI'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/troubleshoot-tool

jobs:
  # --- Job 0: 版本号校验 ---
  verify-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version consistency
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG_VERSION="${{ inputs.version }}"
          else
            TAG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          PYPI_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Tag version:   ${TAG_VERSION}"
          echo "PyPI version:  ${PYPI_VERSION}"
          if [[ "${TAG_VERSION}" != "${PYPI_VERSION}" ]]; then
            echo "版本号不一致！请修改 pyproject.toml 中的 version = \"${TAG_VERSION}\" 后重新提交"
            echo "tag: ${TAG_VERSION} != pyproject.toml: ${PYPI_VERSION}"
            exit 1
          fi
          echo "版本号校验通过: ${TAG_VERSION}"

  # --- Job 1: Lint ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile troubleshooter.py
          python -m py_compile app/main.py
          python -m py_compile app/core/engine.py
          python -m py_compile app/core/database.py
          python -m py_compile app/core/knowledge.py
          python -m py_compile app/models/schemas.py
          python -m py_compile app/api/scenarios.py
          python -m py_compile app/api/diagnosis.py
          python -m py_compile app/api/search.py
          python -m py_compile app/api/reports.py
          python -m py_compile app/api/history.py
      - name: Validate JSON
        run: python -c "import json; json.load(open('knowledge_base.json'))"

  # --- Job 2: Docker build & push (multi-platform) ---
  docker:
    runs-on: ubuntu-latest
    needs: [lint, verify-version]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && inputs.publish_docker != false
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f1-2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.major }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Job 3: Build Python package ---
  build-package:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  # --- Job 4: Publish to PyPI ---
  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-package
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && inputs.publish_pypi != false
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # --- Job 5: GitHub Release (structured changelog) ---
  release:
    runs-on: ubuntu-latest
    needs: [build-package, verify-version]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Generate structured CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-decorate)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --oneline --no-decorate)
          fi
          FEATS=""
          FIXES=""
          DOCS=""
          OTHERS=""
          while IFS= read -r line; do
            if echo "$line" | grep -qiE '^\s*[0-9a-f]+\s+(feat|feature)[\(:]'; then
              FEATS="${FEATS}- ${line#* }"$'\n'
            elif echo "$line" | grep -qiE '^\s*[0-9a-f]+\s+(fix|bugfix|hotfix)[\(:]'; then
              FIXES="${FIXES}- ${line#* }"$'\n'
            elif echo "$line" | grep -qiE '^\s*[0-9a-f]+\s+(docs?|doc)[\(:]'; then
              DOCS="${DOCS}- ${line#* }"$'\n'
            else
              OTHERS="${OTHERS}- ${line#* }"$'\n'
            fi
          done <<< "$LOG"
          echo "## Release v${VERSION}" > /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          if [ -n "$FEATS" ]; then
            echo "### New Features" >> /tmp/changelog.md
            echo "$FEATS" >> /tmp/changelog.md
          fi
          if [ -n "$FIXES" ]; then
            echo "### Bug Fixes" >> /tmp/changelog.md
            echo "$FIXES" >> /tmp/changelog.md
          fi
          if [ -n "$DOCS" ]; then
            echo "### Documentation" >> /tmp/changelog.md
            echo "$DOCS" >> /tmp/changelog.md
          fi
          if [ -n "$OTHERS" ]; then
            echo "### Other Changes" >> /tmp/changelog.md
            echo "$OTHERS" >> /tmp/changelog.md
          fi
          echo "" >> /tmp/changelog.md
          echo "---" >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "### Docker" >> /tmp/changelog.md
          echo '```bash' >> /tmp/changelog.md
          echo "docker pull ${DOCKER_IMAGE}:${VERSION}" >> /tmp/changelog.md
          echo '```' >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "### pip" >> /tmp/changelog.md
          echo '```bash' >> /tmp/changelog.md
          echo "pip install troubleshoot-tool==${VERSION}" >> /tmp/changelog.md
          echo '```' >> /tmp/changelog.md
          echo "" >> /tmp/changelog.md
          echo "### Full Changelog" >> /tmp/changelog.md
          if [ -n "$PREV_TAG" ]; then
            echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}" >> /tmp/changelog.md
          else
            echo "https://github.com/${{ github.repository }}/commits/v${VERSION}" >> /tmp/changelog.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.md
          files: dist/*
          generate_release_notes: false
      - name: Print release summary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "============================================="
          echo "  Release v${VERSION} published!"
          echo "============================================="
          echo ""
          echo "Install:"
          echo "  pip install troubleshoot-tool==${VERSION}"
          echo ""
          echo "Docker:"
          echo "  docker pull ${DOCKER_IMAGE}:${VERSION}"
          echo "  docker run -d -p 8000:8000 ${DOCKER_IMAGE}:${VERSION}"
          echo ""
          echo "Release:"
          echo "  https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          echo "============================================="
