<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故障排查助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">🔧</span>
            <span class="logo-text">故障排查助手</span>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item active" data-page="home" href="#">
                <span class="nav-icon">🏠</span>
                <span>排查首页</span>
            </a>
            <a class="nav-item" data-page="knowledge" href="#">
                <span class="nav-icon">📚</span>
                <span>知识库管理</span>
            </a>
            <a class="nav-item" data-page="history" href="#">
                <span class="nav-icon">📋</span>
                <span>历史记录</span>
            </a>
            <a class="nav-item" data-page="reports" href="#">
                <span class="nav-icon">📄</span>
                <span>故障报告</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="version">v2.0</span>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <header class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="globalSearch" placeholder="搜索故障场景..." autocomplete="off">
                <div class="search-results" id="searchDropdown"></div>
            </div>
        </header>

        <!-- 页面容器 -->
        <div class="page-container" id="pageContainer">
            <!-- 各页面内容由 JS 动态渲染 -->
        </div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/components/sidebar.js"></script>
    <script src="/static/js/components/scenario-card.js"></script>
    <script src="/static/js/components/diagnosis-panel.js"></script>
    <script src="/static/js/components/timeline.js"></script>
    <script src="/static/js/components/search-modal.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
