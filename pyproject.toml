[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "troubleshoot-tool"
version = "2.0.0"
description = "交互式故障排查助手 — 自动诊断服务器/网络故障，支持 Web 界面和 CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "aizhibo" }]
keywords = ["troubleshooting", "diagnosis", "devops", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/aizhibo/troubleshoot-tool"
Repository = "https://github.com/aizhibo/troubleshoot-tool"
Issues = "https://github.com/aizhibo/troubleshoot-tool/issues"

[project.scripts]
troubleshoot = "troubleshooter:main"
